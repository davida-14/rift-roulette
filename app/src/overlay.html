<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Rift Roulette overlay</title>
<style>
/* Build overlay: a compact, see-through card in the corner of the screen. Colours arrive with each build
   from the app's current theme; these are Hextech defaults until the first build lands. */
:root { --panel: rgba(18, 27, 37, .86); --line: #2a3644; --text: #e7e2d4; --muted: #8d97a3; --gold: #c8a65a; }
html, body { margin: 0; background: transparent; overflow: hidden; }
body { font: 14px "Barlow", "Segoe UI", sans-serif; color: var(--text); padding: 6px; user-select: none; }
.card { background: var(--panel); border: 1px solid var(--gold); padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.title { font: 700 15px "Cinzel", Georgia, serif; letter-spacing: .05em; color: var(--gold); }
.mode { font: 500 11px "Barlow Condensed", "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.champ { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.champ img { width: 28px; height: 28px; border: 1px solid var(--gold); }
.row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; }
.row img { width: 30px; height: 30px; border: 1px solid var(--line); }
.row b { font-weight: 600; font-size: 13px; line-height: 1.15; }
.row small { display: block; font: 500 11px "Barlow Condensed", "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.row span.g { font: 500 13px "Barlow Condensed", "Segoe UI", sans-serif; color: var(--gold); font-variant-numeric: tabular-nums; }
.foot { display: flex; justify-content: space-between; font: 500 12px "Barlow Condensed", "Segoe UI", sans-serif; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
.foot b { color: var(--gold); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="card" id="card"><div class="empty">Roll a build in Rift Roulette and it shows up here.</div></div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function show(b) {
  if (b.theme) for (const [k, v] of Object.entries(b.theme)) document.documentElement.style.setProperty("--" + k, v);
  const champ = b.champ ? `<div class="champ"><img src="${b.champ.icon}" alt="">${esc(b.champ.name)}</div>` : "";
  const rows = b.slots.map(s => `<div class="row"><img src="${s.icon}" alt=""><div><small>${esc(s.kind)}</small><b>${esc(s.name)}</b></div><span class="g">${s.gold}</span></div>`).join("");
  document.getElementById("card").innerHTML =
    `<div class="head"><span class="title">Rift Roulette</span><span class="mode">${esc(b.mode)} · ${esc(b.style)}</span></div>`
    + champ + rows
    + `<div class="foot"><span>Ctrl+Shift+B to hide</span><span>Total <b>${b.total}</b> gold</span></div>`;
}
if (window.overlayApi) window.overlayApi.onBuild(show);
window.RR_OVERLAY_SHOW = show;   // lets a test feed in a build
</script>
</body>
</html>
